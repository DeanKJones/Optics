<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bean's Maxwell Playground</title>
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="src/styles/main.css">
</head>

<body>
    <div id="container">
        <div id="canvas-container">
            <canvas id="gfx-main" width="1600" height="900"></canvas>
        </div>
        <div id="divider"></div>
        <div id="scene-container">
            <div id="parameters-stack">
                <div class="parameter-scene">
                    <div class="parameter-scene-header">
                        <div class="parameter-scene-title">
                            <h3>Parameters</h3>
                            <p>Select a component to edit the controls below.</p>
                        </div>
                        <button class="collapse-toggle" id="parameter-collapse-toggle" type="button" aria-expanded="true" aria-label="Collapse parameters panel">▾</button>
                        <div class="component-selector" role="tablist" aria-label="Select parameter component">
                            <button class="component-tab active" type="button" data-panel="simulation" aria-selected="true">Simulation</button>
                            <button class="component-tab" type="button" data-panel="grate" aria-selected="false">Grid</button>
                            <button class="component-tab" type="button" data-panel="wave" aria-selected="false">Wave</button>
                        </div>
                    </div>

                    <div class="parameter-window">
                        <div class="parameter-panel active" data-panel="simulation">
                            <div class="parameters-box simulation-box" id="simulation-parameters-box">
                                <div class="parameters-content">
                                    <div class="parameters-header">
                                        <p class="description">Adjust the visible simulation region and placement</p>
                                    </div>

                                    <div class="parameter-group">
                                        <label for="screen-size-mult-slider">
                                            <span class="parameter-name">Screen Size</span>
                                            <span class="parameter-description">Controls the visible area of the simulation</span>
                                            <div class="slider-container">
                                                <input type="range" id="screen-size-mult-slider" min="1.0" max="6.0" value="1.0"
                                                    step="0.1">
                                                <span id="screen-size-mult-value" class="value-display">1.0</span>
                                            </div>
                                        </label>
                                    </div>

                                    <div class="parameter-group">
                                        <label for="slit-position-slider">
                                            <span class="parameter-name">Grate Distance</span>
                                            <span class="parameter-description">Distance of the grating from the emitter band, following the selected propagation direction</span>
                                            <div class="slider-container">
                                                <input type="range" id="slit-position-slider" min="0.005" max="0.30" value="0.02"
                                                    step="0.001">
                                                <span id="slit-position-value" class="value-display">2.0%</span>
                                            </div>
                                        </label>
                                    </div>


                                    <div class="parameter-group">
                                        <label for="slit-plane-absorption-slider">
                                            <span class="parameter-name">Slit Plane Absorption</span>
                                            <span class="parameter-description">Absorption in the non-slit parts of the plane (90-100%)</span>
                                            <div class="slider-container">
                                                <input type="range" id="slit-plane-absorption-slider" min="0.00" max="1.00" value="1.00"
                                                    step="0.01">
                                                <span id="slit-plane-absorption-value" class="value-display">100%</span>
                                            </div>
                                        </label>
                                    </div>

                                    <div class="parameter-group">
                                        <label for="simulation-substeps-slider">
                                            <span class="parameter-name">Simulation Substeps</span>
                                            <span class="parameter-description">Number of FDTD update steps each rendered frame</span>
                                            <div class="slider-container">
                                                <input type="range" id="simulation-substeps-slider" min="1" max="8" value="2"
                                                    step="1">
                                                <span id="simulation-substeps-value" class="value-display">2 steps/frame</span>
                                            </div>
                                        </label>
                                    </div>

                                    <div class="parameter-group">
                                        <label for="stability-factor-slider">
                                            <span class="parameter-name">Stability Factor</span>
                                            <span class="parameter-description">Courant factor for wave propagation speed (keep 0.70 or lower)</span>
                                            <div class="slider-container">
                                                <input type="range" id="stability-factor-slider" min="0.10" max="0.70" value="0.60"
                                                    step="0.01">
                                                <span id="stability-factor-value" class="value-display">0.60</span>
                                            </div>
                                        </label>
                                    </div>

                                    <div class="parameter-group">
                                        <label for="propagation-direction-select">
                                            <span class="parameter-name">Propagation Direction</span>
                                            <span class="parameter-description">Choose the overall propagation direction used by the simulation</span>
                                            <div class="slider-container">
                                                <select id="propagation-direction-select">
                                                    <option value="0" selected>Top to Bottom</option>
                                                    <option value="1">Bottom to Top</option>
                                                    <option value="2">Left to Right</option>
                                                </select>
                                            </div>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="parameter-panel" data-panel="grate">
                            <div class="parameters-box emitter-box" id="grate-parameters-box">
                                <div class="parameters-content">
                                    <div class="parameters-header">
                                        <p class="description">Tune the diffraction grating geometry</p>
                                    </div>

                                    <div class="parameter-group">
                                        <label for="slit-width-slider">
                                            <span class="parameter-name">Slit Width</span>
                                            <span class="parameter-description">Controls the width of each slit in the diffraction
                                                grating</span>
                                            <div class="slider-container">
                                                <input type="range" id="slit-width-slider" min="0.001" max="0.100" value="0.005"
                                                    step="0.001">
                                                <span id="slit-width-value" class="value-display">0.005 mm</span>
                                            </div>
                                        </label>
                                    </div>

                                    <div class="parameter-group">
                                        <label for="grate-width-slider">
                                            <span class="parameter-name">Grate Width</span>
                                            <span class="parameter-description">Controls the total width of the diffraction
                                                grating</span>
                                            <div class="slider-container">
                                                <input type="range" id="grate-width-slider" min="0.05" max="3.0" value="0.40"
                                                    step="0.01">
                                                <span id="grate-width-value" class="value-display">0.30 mm</span>
                                            </div>
                                        </label>
                                    </div>

                                    <div class="parameter-group">
                                        <label for="number-of-slits-slider">
                                            <span class="parameter-name">Number of Slits</span>
                                            <span class="parameter-description">Controls how many slits are in the diffraction
                                                grating</span>
                                            <div class="slider-container">
                                                <input type="range" id="number-of-slits-slider" min="1.0" max="15.0" value="10.0"
                                                    step="1.0">
                                                <span id="number-of-slits-value" class="value-display">10</span>
                                            </div>
                                        </label>
                                    </div>

                                    <div class="parameter-group">
                                        <label for="slit-thickness-slider">
                                            <span class="parameter-name">Slit Thickness</span>
                                            <span class="parameter-description">Thickness of the grating as a fraction of screen height</span>
                                            <div class="slider-container">
                                                <input type="range" id="slit-thickness-slider" min="0.010" max="0.030" value="0.015"
                                                    step="0.001">
                                                <span id="slit-thickness-value" class="value-display">1.50%</span>
                                            </div>
                                        </label>
                                    </div>

                                </div>
                            </div>
                        </div>

                        <div class="parameter-panel" data-panel="wave">
                            <div class="parameters-box emitter-box" id="emitter-parameters-box">
                                <div class="parameters-content">
                                    <div class="parameters-header">
                                        <p class="description">Edit wavelength, amplitude, and color visualization for the wave source</p>
                                    </div>

                                    <div class="parameter-group">
                                        <label for="wavelength-slider">
                                            <span class="parameter-name">Wavelength</span>
                                            <span class="parameter-description">Controls the wave source wavelength and its perceived color</span>
                                            <div class="slider-container">
                                                <input type="range" id="wavelength-slider" min="10" max="1200" value="500" step="10">
                                                <span id="wavelength-value" class="value-display">500 nm</span>
                                            </div>
                                        </label>
                                    </div>

                                    <div class="parameter-group">
                                        <label for="emitter-amplitude-slider">
                                            <span class="parameter-name">Amplitude</span>
                                            <span class="parameter-description">Controls the wave source amplitude</span>
                                            <div class="slider-container">
                                                <input type="range" id="emitter-amplitude-slider" min="0.50" max="10.00" value="4.00" step="0.10">
                                                <span id="emitter-amplitude-value" class="value-display">4.0</span>
                                            </div>
                                        </label>
                                    </div>

                                    <div class="parameter-group emitter-panel">
                                        <span class="parameter-name">Wave Properties</span>
                                        <span class="parameter-description">Wave-specific settings for the source and visual feedback</span>

                                        <div class="slider-container color-picker-row">
                                            <label for="positive-color-input">Positive Field Color</label>
                                            <div class="color-picker">
                                                <input type="color" id="positive-color-input" value="#0000ff">
                                            </div>
                                        </div>

                                        <div class="slider-container color-picker-row">
                                            <label for="negative-color-input">Negative Field Color</label>
                                            <div class="color-picker">
                                                <input type="color" id="negative-color-input" value="#ff0000">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="key-label"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const tabs = Array.from(document.querySelectorAll('.component-tab'));
            const panels = Array.from(document.querySelectorAll('.parameter-panel'));
            const scene = document.querySelector('.parameter-scene');
            const collapseToggle = document.getElementById('parameter-collapse-toggle');
            const header = document.querySelector('.parameter-scene-header');

            function activatePanel(panelName) {
                tabs.forEach((tab) => {
                    const isActive = tab.getAttribute('data-panel') === panelName;
                    tab.classList.toggle('active', isActive);
                    tab.setAttribute('aria-selected', String(isActive));
                });

                panels.forEach((panel) => {
                    const isActive = panel.getAttribute('data-panel') === panelName;
                    panel.classList.toggle('active', isActive);
                });
            }

            function setCollapsed(isCollapsed) {
                scene?.classList.toggle('collapsed', isCollapsed);
                if (collapseToggle) {
                    collapseToggle.setAttribute('aria-expanded', String(!isCollapsed));
                    collapseToggle.setAttribute('aria-label', isCollapsed ? 'Expand parameters panel' : 'Collapse parameters panel');
                    collapseToggle.textContent = isCollapsed ? '▸' : '▾';
                }
            }

            tabs.forEach((tab) => {
                tab.addEventListener('click', () => {
                    activatePanel(tab.getAttribute('data-panel') || 'simulation');
                });
            });

            collapseToggle?.addEventListener('click', (event) => {
                event.stopPropagation();
                setCollapsed(scene?.classList.contains('collapsed') !== true);
            });

            header?.addEventListener('click', (event) => {
                if (event.target instanceof HTMLElement && event.target.closest('.component-selector')) {
                    return;
                }
                if (event.target instanceof HTMLElement && event.target.closest('.component-tab')) {
                    return;
                }
                setCollapsed(scene?.classList.contains('collapsed') !== true);
            });

            activatePanel('simulation');
            setCollapsed(false);
        });
    </script>

    <script src="dist/main.js"></script>
</body>

</html>
